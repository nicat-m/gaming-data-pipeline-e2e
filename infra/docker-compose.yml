name: gaming-lakehouse

x-airflow-common: &airflow-common
  # Custom image (dbt + kafka client + boto3 + docker SDK baked in) so every
  # pipeline task can run inside the orchestrator - see
  # orchestration/Dockerfile.airflow. `build` reuses the cache after the
  # first `docker compose up`.
  image: gaming-airflow:2.10.2-phase1
  build:
    context: ..
    dockerfile: orchestration/Dockerfile.airflow
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres-airflow:5432/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW_CONN_GAMING_POSTGRES: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    KAFKA_TOPIC_GAME_EVENTS: ${KAFKA_TOPIC_GAME_EVENTS}
    RUSTFS_ENDPOINT_URL: http://rustfs:9000
    RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
    RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    RUSTFS_RAW_BUCKET: ${RUSTFS_RAW_BUCKET}
    SPARK_MASTER_URL: spark://spark-master:7077
    AIRFLOW_CONN_SOURCE_POSTGRES: postgresql://${SOURCE_POSTGRES_USER}:${SOURCE_POSTGRES_PASSWORD}@postgres-source:5432/${SOURCE_POSTGRES_DB}
    # Warehouse (ClickHouse) connection used by the raw-loader, dbt profiles
    # and the serving publisher inside the Airflow containers.
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: "8123"
    CLICKHOUSE_DB: ${CLICKHOUSE_DB}
    CLICKHOUSE_USER: ${CLICKHOUSE_USER}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    # Deliberate-failure switch for the Phase 1 demo: set PIPELINE_FAIL_SWITCH=1
    # in .env, `make up` again, trigger the DAG -> land_raw task raises and
    # everything downstream is skipped. Remove it (or set to 0) to run normally.
    PIPELINE_FAIL_SWITCH: ${PIPELINE_FAIL_SWITCH:-0}
    SPARK_CONTAINER_NAME: ${SPARK_CONTAINER_NAME:-gaming-spark-master}
    PYTHONPATH: /opt/airflow
  volumes:
    - ../orchestration/dags:/opt/airflow/dags
    - ../ingestion:/opt/airflow/ingestion
    - ../config:/opt/airflow/config
    - ../transformation:/opt/airflow/transformation
    - ../transformation/spark_jobs:/opt/spark-apps
    # Read-only docker socket: only used by the Spark connectivity-proof
    # task (`docker exec`-equivalent via the docker SDK) to reach the
    # standalone Spark container from Airflow.
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres-airflow:
      condition: service_healthy
  networks:
    - gaming-net

services:
  postgres-source:
    image: postgres:16.4
    container_name: gaming-postgres-source
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_USER: ${SOURCE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SOURCE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${SOURCE_POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres-source-data:/var/lib/postgresql/data
      - ./postgres-source/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SOURCE_POSTGRES_USER} -d ${SOURCE_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gaming-net

  # Analytic warehouse (was PostgreSQL 16.4 until Phase 1; replaced by
  # ClickHouse for columnar scan speed and native aggregates - see
  # docs/az/TEXNIKI_IZAHLAR.md, "Anbar seçimi"). The source OLTP database
  # (`postgres-source`) stays PostgreSQL - that one is the "source system",
  # not the warehouse.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8.14.39
    container_name: gaming-clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
    ports:
      - "8123:8123"   # HTTP interface (dbt-clickhouse, Superset, curl)
      - "9004:9000"   # native protocol (host maps 9004 because RustFS owns
                      # host port 9000; inside the compose network services
                      # reach ClickHouse by name, not host port)
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:8123/ping' | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gaming-net

  postgres-airflow:
    image: postgres:16.4
    container_name: gaming-airflow-postgres
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gaming-net

  kafka:
    image: apache/kafka:3.8.0
    container_name: gaming-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:19093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks:
      - gaming-net

  kafka-connect:
    image: debezium/connect:2.7.3.Final
    container_name: gaming-kafka-connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: gaming-connect-cluster
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    depends_on:
      kafka:
        condition: service_healthy
      postgres-source:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks:
      - gaming-net

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: gaming-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: gaming-lakehouse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: gaming-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - gaming-net

  # Analytic dashboard (Phase 2): connects to the ClickHouse warehouse over
  # the HTTP interface (8123) and visualises the curated/serving models -
  # including the live event view built on the Kafka push channel.
  # Credentials come from .env (SUPERSET_* variables); the ClickHouse
  # database connection is created by scripts/superset_seed.py (make seed-superset).
  superset:
    image: apache/superset:4.1.1
    container_name: gaming-superset
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      # Used by seed.py to create the ClickHouse connection (no UI clicking).
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
    entrypoint: ["sh", "-c", "pip install --no-cache-dir clickhouse-connect==0.7.19 && exec superset run -h 0.0.0.0 -p 8088"]
    command: []
    ports:
      - "8088:8088"
    volumes:
      - superset-data:/app/superset_home
      - ../scripts/superset_seed.py:/app/superset_home/seed.py:ro
      - ./superset/superset_config.py:/app/superset_config.py:ro
    depends_on:
      clickhouse:
        condition: service_healthy
      # Wait for migrations + admin creation; starting both at once races on
      # the shared SQLite metadata DB and leaves no admin user.
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - gaming-net

  # One-shot bootstrap: runs migrations + creates the admin user, then exits.
  # (Superset keeps its metadata DB in the mounted volume; re-running is safe.)
  superset-init:
    image: apache/superset:4.1.1
    container_name: gaming-superset-init
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET__DATABASE__SQLA_URI: sqlite:////app/superset_home/superset.db
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
    entrypoint: ["sh", "-c", "pip install --no-cache-dir clickhouse-connect==0.7.19 && (superset db upgrade && superset fab create-admin --username $$SUPERSET_ADMIN_USER --password $$SUPERSET_ADMIN_PASSWORD --firstname Gaming --lastname Admin --email admin@gaming.local || true) && superset init"]
    volumes:
      - superset-data:/app/superset_home
      - ../scripts/superset_seed.py:/app/superset_home/seed.py:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - gaming-net

  spark-master:
    image: bitnamilegacy/spark:3.5.3
    container_name: gaming-spark-master
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
    ports:
      - "7077:7077"
      - "8081:8080"
    volumes:
      - ../transformation/spark_jobs:/opt/spark-apps
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080')\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - gaming-net

  spark-worker:
    image: bitnamilegacy/spark:3.5.3
    container_name: gaming-spark-worker
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 1G
      SPARK_WORKER_CORES: 1
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
    volumes:
      - ../transformation/spark_jobs:/opt/spark-apps
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - gaming-net

  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: gaming-rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - gaming-net

  airflow-init:
    <<: *airflow-common
    container_name: gaming-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com
    depends_on:
      postgres-airflow:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    container_name: gaming-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: gaming-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

networks:
  gaming-net:
    driver: bridge

volumes:
  postgres-source-data:
  clickhouse-data:
  postgres-airflow-data:
  kafka-data:
  rustfs-data:
  airflow-logs:
  superset-data:
