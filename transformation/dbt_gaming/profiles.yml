# Safe to commit: every value is read from an environment variable at
# runtime via env_var(), no secret literal appears in this file.
# Point DBT_PROFILES_DIR at this directory to use it, e.g.:
#   export DBT_PROFILES_DIR=$(pwd)/transformation/dbt_gaming

dbt_gaming:
  target: dev
  outputs:
    dev:
      type: clickhouse
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | as_number }}"
      user: "{{ env_var('CLICKHOUSE_USER') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD') }}"
      schema: "{{ env_var('CLICKHOUSE_DB', 'gaming_lakehouse') }}"
      driver: http
      threads: 4
