version: 2

sources:
  - name: raw
    schema: raw
    description: >
      As-landed data loaded from the RustFS raw bucket by the Airflow
      "load_raw_to_clickhouse" task (ClickHouse raw database, ReplacingMergeTree).
    tables:
      - name: game_events
        description: One row per raw Kafka game event, loaded as-is (no cleaning).
